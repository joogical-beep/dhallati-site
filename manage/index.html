<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>ضالّتي | تفعيل الجهات</title><link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>:root{--bg:#2F2924;--ink:#F1E7D6;--soft:#C9BBA6;--card:#3A322B;--line:#4E433A;--butter:#F2E2A0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 60px}
h1{color:var(--butter);font-size:1.7rem;margin:8px 0 18px}input{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--butter);color:#2F2924}
button.o{background:transparent;color:var(--soft);border:1px solid var(--line)}
.v{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.v b{display:block;font-size:1.1rem}.v small{color:var(--soft);direction:ltr;unicode-bidi:isolate}.ok{color:#9fd49f}.msg{color:var(--soft);min-height:1.5em}
h2{font-size:1.1rem;color:var(--soft);margin:24px 0 10px}</style></head><body><div class="w">
<h1>تفعيل الجهات</h1>
<div id="login"><input id="em" type="email" dir="ltr" placeholder="البريد" autocomplete="email"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور" autocomplete="current-password"><button id="go">دخول</button><p class="msg" id="lm"></p></div>
<div id="app" hidden><p class="msg" id="m"></p><h2>بانتظار التفعيل</h2><div id="pend"></div><h2>المفعّلة</h2><div id="done"></div><p><button class="o" id="out">خروج</button></p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://efhmdxoqjbwkyxhievyv.supabase.co","sb_publishable_IE1VnqygsApInZcMhZ4oeA_Ntygg89E");
const $=i=>document.getElementById(i);const C={riyadh:"الرياض",jeddah:"جدة",makkah:"مكة",madinah:"المدينة",dammam:"الدمام"};
function card(v){const d=document.createElement("div");d.className="v";
 const t=document.createElement("div");const b=document.createElement("b");b.textContent=v.name_ar||v.name_en||"—";
 const s=document.createElement("small");s.textContent=(C[v.city]||v.city||"")+"  "+(v.email||"");t.append(b,s);
 const btn=document.createElement("button");btn.textContent=v.approved?"إيقاف":"تفعيل";if(v.approved)btn.className="o";
 btn.onclick=async()=>{btn.disabled=true;const {error}=await sb.rpc("admin_set_venue",{v:v.id,ok:!v.approved});
  $("m").textContent=error?"ما تم، حاولي مرة ثانية":(v.approved?"تم إيقاف ":"تم تفعيل ")+(v.name_ar||"");load()};
 d.append(t,btn);return d}
async function load(){const {data,error}=await sb.rpc("admin_venues");
 if(error){$("app").hidden=true;$("login").hidden=false;$("lm").textContent="هذا الحساب ما عنده صلاحية";await sb.auth.signOut();return}
 $("login").hidden=true;$("app").hidden=false;$("pend").innerHTML="";$("done").innerHTML="";
 const p=data.filter(x=>!x.approved),a=data.filter(x=>x.approved);
 if(!p.length)$("pend").textContent="ما فيه طلبات جديدة";p.forEach(v=>$("pend").append(card(v)));a.forEach(v=>$("done").append(card(v)))}
$("go").onclick=async()=>{$("lm").textContent="";const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error){$("lm").textContent="البريد أو كلمة المرور غير صحيحة";return}load()};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script></body></html>
